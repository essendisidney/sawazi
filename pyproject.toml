# Vercel reads this file (it installs from here, not requirements.txt). Keep the dependencies equal to the
# runtime lines of requirements.txt; tests/test_deploy.py checks it.
[project]
name = "sawazi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "rapidfuzz==3.14.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "sawazi.api:app"
