# Sawazi on one server: PostgreSQL, the app, Caddy for HTTPS, and nightly backups. See docs/DEPLOY.md.
#   cd deploy && cp .env.example .env   (fill it in)   && docker compose up -d --build
# Only Caddy is reachable from outside (ports 80 and 443). The database and the app are on a private network.
name: sawazi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sawazi
      POSTGRES_USER: sawazi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawazi -d sawazi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  app:
    build: ..
    image: sawazi:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SAWAZI_DB_URL: postgresql+psycopg://sawazi:${POSTGRES_PASSWORD}@db:5432/sawazi
      SAWAZI_PUBLIC_URL: https://${SAWAZI_DOMAIN:?set SAWAZI_DOMAIN in deploy/.env}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SAWAZI_DOMAIN: ${SAWAZI_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [private]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: sawazi
      PGDATABASE: sawazi
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT: ${BACKUP_AT:-01:30}
      TZ: Africa/Nairobi
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  private:
