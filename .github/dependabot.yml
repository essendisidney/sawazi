# Weekly upgrade proposals as pull requests; the tests workflow checks each one before it can be merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Africa/Nairobi}
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
